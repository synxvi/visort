name: visort_flutter
description: "Image organizer — keyboard-driven photo sorting tool."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.0
  path_provider: ^2.1.0
  path: ^1.9.0
  collection: ^1.18.0
  window_manager: ^0.5.0
  shared_preferences: ^2.2.0
  flutter_animate: ^4.5.0
  # 大图浏览器：extended_image 本地 fork（主分支机制，_canScrollPage 边缘翻页/
  # 双击 2 段循环/filmstrip/详情面板/Hero flight 原生支持，经真机验证）。
  extended_image:
    path: packages/extended_image


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: "Space Mono"
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: Noto Sans Mono CJK SC
      fonts:
        - asset: assets/fonts/NotoSansMonoCJKsc-Regular.otf
        - asset: assets/fonts/NotoSansMonoCJKsc-Bold.otf
          weight: 700
