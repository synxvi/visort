name: visort_flutter
description: "Image organizer — keyboard-driven photo sorting tool."
publish_to: 'none'
version: 1.3.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  file_picker: ^12.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  window_manager: ^0.5.0
  shared_preferences: ^2.2.0
  flutter_animate: ^4.5.0
  # [SQLite 改造 P0] 数据级持久化底座(见 docs/SQLITE_ROADMAP.md):
  #   - sqflite: 安卓走 method channel(系统 SQLite)
  #   - sqflite_common_ffi: Windows/测试走 ffi(databaseFactory 覆盖)
  #   - sqlite3_flutter_libs: 桌面端捆绑 SQLite 原生库(Win 无系统 sqlite3.dll)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28
  # [ente 对齐] 大图浏览器用 photo_view（ente 同款 0.15.0）本地 fork：
  # 缩放/回弹/双击/Hero 动画与 ente 完全一致。
  # fork patch：PhotoViewGestureRecognizer 双轴边缘裁决（X/Y 任一可移动即 accept，
  # 放大后平移到 X 边缘释放给 PageView 翻页——原版 axis:vertical 时 X 永不释放）。
  photo_view:
    path: packages/photo_view


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: "Space Mono"
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: Noto Sans Mono CJK SC
      fonts:
        - asset: assets/fonts/NotoSansMonoCJKsc-Regular.otf
        - asset: assets/fonts/NotoSansMonoCJKsc-Bold.otf
          weight: 700
