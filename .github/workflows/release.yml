name: Build and Release

# Flutter 双端构建：Android (split-per-ABI APK) + Windows (zip)。
# 触发：打 v* tag 自动构建并发布 Release；或手动 workflow_dispatch。
# 原 PyInstaller (legacy Python) 流程已随 app.py/index.html 移除。
#
# 链路：quality（analyze + test 门禁）→ 双端并行构建 → 发布 Release 资产。
# Flutter 版本显式 pin：CI 拉最新 stable 会让「今天验证过的包」与
# 「用户下载到的包」不一致（本仓依赖本地 SDK 补丁，更须锁版消除变量）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Analyze & Test (gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        # HeroController.onPopFlightStarted 是本机 SDK 的 visort 补丁 API
        #（归档于 flutter-sdk-patches/）；官方 SDK 无此 API，不打补丁
        # analyze/编译直接 error。
        # ⚠ patch --forward 的幂等怪癖：runner 复用 tool cache 时 SDK 已带
        # 补丁，patch 会把全部 hunk 标记 ignored、写 .rej 并 exit 1——这是
        # 幂等命中的正常形态而非失败；真正 context 漂移才会出现 FAILED。
        run: |
          set +e
          out=$(patch -d "$FLUTTER_ROOT" -p1 --forward < flutter-sdk-patches/heroes-pop-flight_v3.47.patch 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -q "previously applied" && ! echo "$out" | grep -q "FAILED"; then
              echo "SDK 已带补丁（tool cache 幂等命中），跳过"
            else
              echo "::error::SDK patch 应用失败（heroes.dart context 漂移？需重制补丁）"
              exit 1
            fi
          fi
          rm -f "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/heroes.dart.rej"

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: visort_flutter
        # 门禁语义：仅 error 级阻断。--no-fatal-infos/--no-fatal-warnings 在
        # CI 纯净 SDK 上曾被观察到 exit 1（存量 info/warning 也非零，与本地
        # 行为不一致），故再按输出内容复核——有 error 级问题才真正失败。
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          if grep -qE "^[[:space:]]*error[[:space:]]+•" analyze.log; then
            echo "::error::analyze 发现 error 级问题"
            exit 1
          fi
          echo "analyze 通过（error 级为零；info/warning 存量见上方日志）"

      - name: Prefetch sqlite3 native assets (bypass GH release CDN 504)
        # 2026-11 起 GitHub release 资产下载端点持续 504，sqlite3 包的
        # native-assets hook 把 504 错误页落盘、哈希校验失败挂掉 job。
        # 预取走 api.github.com 通道（不受影响）+ 哈希校验，填入 hook
        # shared 缓存后 hook 命中即跳过下载。详见脚本头注释。
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash visort_flutter/tools/prefetch_sqlite3_assets.sh linux

      - name: Test
        working-directory: visort_flutter
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        run: |
          cp "$GITHUB_WORKSPACE/flutter-sdk-patches/heroes_3.47.1_patched.dart" \
            "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/heroes.dart"

      - name: Restore release keystore
        # 签名密钥以 base64 存 GitHub secret（VISORT_KEYSTORE_BASE64），
      # 解码到仓库外路径并与 key.properties 对齐。secret 缺失时跳过
      #（回落 debug 签名，仅本地语义——正式发版必须配置）。
        env:
          VISORT_KEYSTORE_BASE64: ${{ secrets.VISORT_KEYSTORE_BASE64 }}
          VISORT_KEYSTORE_PASSWORD: ${{ secrets.VISORT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VISORT_KEYSTORE_BASE64" ]; then
            echo "::warning::VISORT_KEYSTORE_BASE64 secret 未配置，将回落 debug 签名（正式发版不可接受）"
            exit 0
          fi
          mkdir -p "$HOME/keystores"
          echo "$VISORT_KEYSTORE_BASE64" | base64 -d > "$HOME/keystores/visort-release.keystore"
          cat > visort_flutter/android/key.properties <<EOF
          storeFile=$HOME/keystores/visort-release.keystore
          storePassword=$VISORT_KEYSTORE_PASSWORD
          keyAlias=visort
          keyPassword=$VISORT_KEYSTORE_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Prefetch sqlite3 native assets (bypass GH release CDN 504)
        # 同 quality job（见其注释）：android 需 arm64/arm/x64 三个 ABI 资产
        #（split-per-ABI + universal）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash visort_flutter/tools/prefetch_sqlite3_assets.sh android

      - name: Prefetch Gradle distribution (bypass GH release CDN 504)
        # 同一 504 故障面：services.gradle.org 307 重定向到 GitHub release
        # 资产（gradle/gradle-distributions），Gradle wrapper 下载发行版
        # 失败。gh api 通道预取 + wrapper 改指本地 file:// 副本——只改
        # CI checkout 副本，仓库与本地构建不受影响。
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash visort_flutter/tools/prefetch_gradle_dist.sh

      - name: Use official Maven repos (bypass aliyun mirror 502)
        # settings.gradle.kts 的国内镜像（aliyun/flutter-io.cn）是本地开发
        # 加速；CI runner（美国）访问 aliyun 间歇 502，且 Gradle 对 5xx 的
        # 行为是禁用整个仓库、不回退到列表后面的官方源——镜像行必须整个
        # 拿掉。只改 CI checkout 副本，走 google()/mavenCentral() 直连。
        run: sed -i '/maven\.aliyun\.com\|storage\.flutter-io\.cn/d' visort_flutter/android/settings.gradle.kts

      - name: Build APK (split per ABI)
        working-directory: visort_flutter
        # 产出 arm64-v8a / armeabi-v7a / universal 三个分包。
        # --obfuscate + --split-debug-info：剥离 libapp.so 内的 Dart 符号/调试
        # 信息（省 0.5~1.5MB），符号映射写入 build/symbols/ 并以 artifact 归档，
        # 反混淆堆栈时按 tag 下载对应一份。
        # settings.gradle.kts 的国内镜像在 CI runner 上公网可达，无需改 Gradle 配置。
        # ⚠️ flutter 工具对 per-ABI versionCode 定制过的 universal 包会误报
        # "failed to produce an .apk"（exit 1），实际三包全部成功——universal
        # 生成在 apk/release/ 而工具只在 flutter-apk/ 找。故 || true 后以
        # 产物存在性为准，universal 缺席时从 apk/release/ 补拷。
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols || true
          SRC=build/app/outputs
          test -f "$SRC/flutter-apk/app-arm64-v8a-release.apk" || { echo "::error::arm64 APK 缺失"; exit 1; }
          test -f "$SRC/flutter-apk/app-armeabi-v7a-release.apk" || { echo "::error::v7a APK 缺失"; exit 1; }
          if [ ! -f "$SRC/flutter-apk/app-release.apk" ]; then
            cp "$SRC/apk/release/app-universal-release.apk" "$SRC/flutter-apk/app-release.apk" \
              || { echo "::error::universal APK 缺失"; exit 1; }
          fi
          echo "三包 APK 就绪"

      - name: Rename APKs with tag version
        # app-arm64-v8a-release.apk → visort-v1.3.0-ci7-arm64-v8a.apk（带版本
        # 便于用户辨认与排查覆盖升级）。universal 单独处理——app-release.apk
        # 不匹配 app-*-release.apk 的 glob（中间无字符），旧写法漏了它。
        working-directory: visort_flutter/build/app/outputs/flutter-apk
        run: |
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "visort-${{ github.ref_name }}-universal.apk"
          fi
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "visort-${{ github.ref_name }}-${abi}.apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: visort_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload obfuscation symbols
        # --obfuscate 产物必须配对归档：堆栈里的类名/函数名都是混淆后的别名，
        # 反混淆只能靠这份符号文件。artifact 默认 90 天过期，放 1 年。
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: visort_flutter/build/symbols/*
          if-no-files-found: error
          retention-days: 365

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        # 同 linux job（见 quality 注释）：直接覆盖归档的 patched heroes.dart。
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE/flutter-sdk-patches/heroes_3.47.1_patched.dart" `
            "$env:FLUTTER_ROOT/packages/flutter/lib/src/widgets/heroes.dart" -Force

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Prefetch sqlite3 native assets (bypass GH release CDN 504)
        # 同 quality job（见其注释）。windows job 默认 pwsh，须切 bash
        #（脚本依赖 sha256sum/sed/awk 等 git-bash 工具）。
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash visort_flutter/tools/prefetch_sqlite3_assets.sh windows

      - name: Build Windows
        working-directory: visort_flutter
        run: flutter build windows --release

      - name: Package Windows build
        # Flutter 产物是一组 exe + dll + data 目录，打包成单个 zip 便于分发。
        # zip 名带 tag 版本（visort-v1.3.0-windows-x64.zip）。
        shell: pwsh
        run: |
          Compress-Archive -Path visort_flutter/build/windows/x64/runner/Release/* -DestinationPath visort-${{ github.ref_name }}-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: visort-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # 不指定 name → 下载全部 artifact；merge 到同一目录供 gh-release 收集。
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          overwrite_files: true
