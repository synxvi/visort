name: Build and Release

# Flutter 双端构建：Android (split-per-ABI APK) + Windows (zip)。
# 触发：打 v* tag 自动构建并发布 Release；或手动 workflow_dispatch。
# 原 PyInstaller (legacy Python) 流程已随 app.py/index.html 移除。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Build APK (split per ABI)
        working-directory: visort_flutter
        # 产出 arm64-v8a / armeabi-v7a / universal 三个分包。
        # settings.gradle.kts 的国内镜像在 CI runner 上公网可达，无需改 Gradle 配置。
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: visort_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Build Windows
        working-directory: visort_flutter
        run: flutter build windows --release

      - name: Package Windows build
        # Flutter 产物是一组 exe + dll + data 目录，打包成单个 zip 便于分发。
        shell: pwsh
        run: |
          Compress-Archive -Path visort_flutter/build/windows/x64/runner/Release/* -DestinationPath visort-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: visort-windows.zip
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # 不指定 name → 下载全部 artifact；merge 到同一目录供 gh-release 收集。
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          overwrite_files: true
