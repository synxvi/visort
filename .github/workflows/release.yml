name: Build and Release

# Flutter 双端构建：Android (split-per-ABI APK) + Windows (zip)。
# 触发：打 v* tag 自动构建并发布 Release；或手动 workflow_dispatch。
# 原 PyInstaller (legacy Python) 流程已随 app.py/index.html 移除。
#
# 链路：quality（analyze + test 门禁）→ 双端并行构建 → 发布 Release 资产。
# Flutter 版本显式 pin：CI 拉最新 stable 会让「今天验证过的包」与
# 「用户下载到的包」不一致（本仓依赖本地 SDK 补丁，更须锁版消除变量）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Analyze & Test (gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        # HeroController.onPopFlightStarted 是本机 SDK 的 visort 补丁 API
        #（归档于 flutter-sdk-patches/）；官方 SDK 无此 API，不打补丁
        # analyze/编译直接 error。--forward 幂等（缓存 SDK 已打过则跳过）。
        run: |
          patch -d "$FLUTTER_ROOT" -p1 --forward < flutter-sdk-patches/heroes-pop-flight_v3.44.patch \
            || { echo "::error::SDK patch 应用失败（heroes.dart context 漂移？需重制补丁）"; exit 1; }

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: visort_flutter
        # 门禁语义：仅 error 级阻断。--no-fatal-infos/--no-fatal-warnings 在
        # CI 纯净 SDK 上曾被观察到 exit 1（存量 info/warning 也非零，与本地
        # 行为不一致），故再按输出内容复核——有 error 级问题才真正失败。
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          if grep -qE "^[[:space:]]*error[[:space:]]+•" analyze.log; then
            echo "::error::analyze 发现 error 级问题"
            exit 1
          fi
          echo "analyze 通过（error 级为零；info/warning 存量见上方日志）"

      - name: Test
        working-directory: visort_flutter
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        run: |
          patch -d "$FLUTTER_ROOT" -p1 --forward < flutter-sdk-patches/heroes-pop-flight_v3.44.patch \
            || { echo "::error::SDK patch 应用失败"; exit 1; }

      - name: Restore release keystore
        # 签名密钥以 base64 存 GitHub secret（VISORT_KEYSTORE_BASE64），
      # 解码到仓库外路径并与 key.properties 对齐。secret 缺失时跳过
      #（回落 debug 签名，仅本地语义——正式发版必须配置）。
        env:
          VISORT_KEYSTORE_BASE64: ${{ secrets.VISORT_KEYSTORE_BASE64 }}
          VISORT_KEYSTORE_PASSWORD: ${{ secrets.VISORT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VISORT_KEYSTORE_BASE64" ]; then
            echo "::warning::VISORT_KEYSTORE_BASE64 secret 未配置，将回落 debug 签名（正式发版不可接受）"
            exit 0
          fi
          mkdir -p "$HOME/keystores"
          echo "$VISORT_KEYSTORE_BASE64" | base64 -d > "$HOME/keystores/visort-release.keystore"
          cat > visort_flutter/android/key.properties <<EOF
          storeFile=$HOME/keystores/visort-release.keystore
          storePassword=$VISORT_KEYSTORE_PASSWORD
          keyAlias=visort
          keyPassword=$VISORT_KEYSTORE_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Build APK (split per ABI)
        working-directory: visort_flutter
        # 产出 arm64-v8a / armeabi-v7a / universal 三个分包。
        # settings.gradle.kts 的国内镜像在 CI runner 上公网可达，无需改 Gradle 配置。
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with tag version
        # app-arm64-v8a-release.apk → visort-v1.3.0-arm64-v8a.apk（带版本便于
        # 用户辨认与排查覆盖升级）。
        working-directory: visort_flutter/build/app/outputs/flutter-apk
        run: |
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "visort-${{ github.ref_name }}-${abi}.apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: visort_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply local Flutter SDK patch (hero pop-flight)
        # 同 linux job（见 quality 注释）；Windows runner 无 GNU patch，
        # 用 git apply（tarball SDK 非 git repo，git apply 仍可作为独立
        # patch 工具使用）。--reverse --check 成功 = 已打过，跳过。
        shell: pwsh
        run: |
          $patch = "$env:GITHUB_WORKSPACE/flutter-sdk-patches/heroes-pop-flight_v3.44.patch"
          git -C $env:FLUTTER_ROOT apply --reverse --check $patch 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "patch already applied, skip"
          } else {
            git -C $env:FLUTTER_ROOT apply $patch
            if ($LASTEXITCODE -ne 0) { Write-Error "SDK patch 应用失败"; exit 1 }
          }

      - name: Install dependencies
        working-directory: visort_flutter
        run: flutter pub get

      - name: Build Windows
        working-directory: visort_flutter
        run: flutter build windows --release

      - name: Package Windows build
        # Flutter 产物是一组 exe + dll + data 目录，打包成单个 zip 便于分发。
        # zip 名带 tag 版本（visort-v1.3.0-windows-x64.zip）。
        shell: pwsh
        run: |
          Compress-Archive -Path visort_flutter/build/windows/x64/runner/Release/* -DestinationPath visort-${{ github.ref_name }}-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: visort-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # 不指定 name → 下载全部 artifact；merge 到同一目录供 gh-release 收集。
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          overwrite_files: true
