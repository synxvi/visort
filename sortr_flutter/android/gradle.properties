# 内存受限环境（模拟器常驻）下的保守配置：堆 8G→2G、元空间 4G→1G
# 宿主 11G 内存，模拟器占 4G，Gradle daemon 8G+4G 会直接 OOM
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin compile daemon JVM 参数
# 修复 Kotlin 2.2.20 + JDK 21 的 GC 自动选择崩溃：
# "The daemon has terminated unexpectedly ... Problems may have occurred during auto-selection of GC"
kotlin.daemon.jvmargs=-Xmx1g -XX:-UseParallelGC

# ── 构建加速（仅影响构建速度，不影响运行时）──
org.gradle.caching=true
org.gradle.parallel=true
# 非传递 R 类：每个库模块只生成自己资源的 R，减少 app 模块 R 体积与编译开销
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# ── 依赖下载超时(毫秒)：卡住的连接快速失败重试，而非无限挂起 ──
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.repository.max.retries=3
