org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin compile daemon JVM 参数
# 修复 Kotlin 2.2.20 + JDK 21 的 GC 自动选择崩溃：
# "The daemon has terminated unexpectedly ... Problems may have occurred during auto-selection of GC"
kotlin.daemon.jvmargs=-Xmx2g -XX:-UseParallelGC

# ── 构建加速（仅影响构建速度，不影响运行时）──
org.gradle.caching=true
org.gradle.parallel=true
# 非传递 R 类：每个库模块只生成自己资源的 R，减少 app 模块 R 体积与编译开销
android.nonTransitiveRClass=true
